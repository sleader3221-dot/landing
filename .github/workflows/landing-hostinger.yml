name: Deploy Landing Page to Hostinger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-hostinger-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-landing:
    name: Build landing page only
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout landing-page repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        run: npm run build

      - name: Prepare deployment archive
        run: |
          rm -rf .github-deploy
          mkdir -p .github-deploy
          tar -czf .github-deploy/landing-page.tgz \
            .next \
            app \
            components \
            content \
            lib \
            public \
            package.json \
            package-lock.json \
            next.config.mjs \
            next-env.d.ts \
            tsconfig.json

      - name: Upload landing-page artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-deployment
          path: .github-deploy/landing-page.tgz
          if-no-files-found: error
          retention-days: 1

  deploy-hostinger:
    name: Deploy frontend to Hostinger
    needs: build-landing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hostinger-landing

    steps:
      - name: Download production frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: landing-page-deployment
          path: .github-deploy

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

      - name: Configure secure SSH connection
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [[ -z "$HOSTINGER_HOST" || -z "$HOSTINGER_USER" || -z "$HOSTINGER_SSH_KEY" ]]; then
            echo "Missing Hostinger SSH secret." >&2
            exit 1
          fi

          printf '%s' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/hostinger_key"
          chmod 600 "$HOME/.ssh/hostinger_key"
          ssh-keygen -y -f "$HOME/.ssh/hostinger_key" >/dev/null
          ssh-keyscan -H "$HOSTINGER_HOST" > "$HOME/.ssh/known_hosts"

      - name: Upload and deploy production frontend
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_WEBROOT: ${{ secrets.HOSTINGER_WEBROOT }}
        run: |
          set -euo pipefail
          SSH_KEY="$HOME/.ssh/hostinger_key"
          SSH_HOST="$HOSTINGER_HOST"
          SSH_USER="$HOSTINGER_USER"
          WEBROOT="$HOSTINGER_WEBROOT"

          if [[ -z "$WEBROOT" ]]; then
            echo "HOSTINGER_WEBROOT is required." >&2
            exit 1
          fi

          scp -i "$SSH_KEY" -o StrictHostKeyChecking=yes \
            .github-deploy/landing-page.tgz \
            "$SSH_USER@$SSH_HOST:$WEBROOT/landing-page.tgz"

          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            "$SSH_USER@$SSH_HOST" "set -euo pipefail
              mkdir -p '$WEBROOT'
              rm -rf '$WEBROOT'/node_modules '$WEBROOT'/package.json '$WEBROOT'/package-lock.json '$WEBROOT'/next.config.mjs '$WEBROOT'/next-env.d.ts '$WEBROOT'/tsconfig.json '$WEBROOT'/app '$WEBROOT'/components '$WEBROOT'/content '$WEBROOT'/lib '$WEBROOT'/public '$WEBROOT'/\.next
              tar -xzf '$WEBROOT'/landing-page.tgz -C '$WEBROOT'
              cd '$WEBROOT'
              npm ci --omit=dev --no-audit --no-fund
              if [ -f '$WEBROOT'/landing-server.pid ]; then
                kill \"\$(cat '$WEBROOT'/landing-server.pid)\" 2>/dev/null || true
              fi
              rm -f '$WEBROOT'/landing-server.pid
              nohup ./node_modules/.bin/next start --hostname 0.0.0.0 --port 3000 > '$WEBROOT'/landing-server.log 2>&1 &
              echo \$! > '$WEBROOT'/landing-server.pid
              sleep 5
              curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null"

          rm -f "$SSH_KEY" "$HOME/.ssh/known_hosts"
